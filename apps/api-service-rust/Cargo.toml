[package]
name = "api-service-rust"
version = "1.0.0"
edition = "2021"
# Locked deps (time-macros, icu 2.x, ...) use edition2024, so Cargo < 1.85
# cannot even parse their manifests. This makes old toolchains fail clearly.
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
scraper = "0.23"
regex = "1"
base64 = "0.22"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ego-tree = "0.10"
